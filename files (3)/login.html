<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>SMART HRD | 로그인</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="login-wrap">
  <div class="card login-card">
    <div class="brand-mark">HRD</div>
    <h2>SMART HRD 출결관리 포털</h2>

    <form id="login-form">
      <div class="field">
        <label>아이디</label>
        <input type="text" id="login-id" placeholder="아이디를 입력하세요">
      </div>
      <div class="field">
        <label>비밀번호</label>
        <input type="password" id="login-pw" placeholder="비밀번호를 입력하세요">
      </div>
      <button type="submit" class="btn btn-primary">로그인</button>
    </form>

    <div class="login-hint">데모 계정: 아이디/비밀번호 아무 값이나 입력해 보세요.</div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
