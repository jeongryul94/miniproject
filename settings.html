<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>SMART HRD | 규정 및 시스템 설정</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">HRD</div>
      <div><div class="brand-name">SMART HRD</div><div class="brand-sub">출결랭싱 동일포털</div></div>
    </div>
    <div class="nav-label">교육과정 관리</div>
    <nav class="nav">
      <a class="nav-item" href="index.html" data-page="index.html"><span>▦ 대시보드 홈</span></a>
      <a class="nav-item" href="attendance.html" data-page="attendance.html"><span>☑ 출결 현황 모니터링</span></a>
      <a class="nav-item" href="assignment.html" data-page="assignment.html"><span>☷ 과제 제출 현황</span></a>
      <a class="nav-item" href="students.html" data-page="students.html"><span>▤ 교육생 명부</span></a>
      <a class="nav-item" href="settings.html" data-page="settings.html"><span>⚙ 규정 및 시스템 설정</span></a>
    </nav>
    <div class="sidebar-footer">행정 가이드라인<br>HRD-Net 연동 지침</div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="course-select">빅데이터 기반 AI 전문가 과정 4기 ▾</div>
      <div class="room-tag"><span class="dot"></span>강의실: 제1스마트융합실</div>
      <div class="topbar-right">
        <button class="icon-btn" data-label="알림">🔔<span class="dot"></span></button>
        <div class="profile">
          <div class="profile-avatar">김</div>
          <div><div class="profile-name">김담임 매니저</div><div class="profile-role">운영/담임 교강사</div></div>
        </div>
      </div>
    </header>

    <div class="content">
      <div class="page-header">
        <div>
          <div class="page-title">규정 및 시스템 설정</div>
          <div class="page-sub">출결 인정 기준과 알림 방식을 설정합니다.</div>
        </div>
      </div>

      <div class="card card-pad" style="max-width:560px;">
        <div class="card-title">출결 규정</div>
        <div class="field">
          <label>수료 최소 출석률 (%)</label>
          <input type="number" value="80">
        </div>
        <div class="field">
          <label>지각 인정 기준 (분)</label>
          <input type="number" value="15">
        </div>
        <div class="field">
          <label>증빙서류 제출 기한 (일)</label>
          <input type="number" value="3">
        </div>
        <button class="btn btn-primary" onclick="alert('설정이 저장되었습니다. (프로토타입 데모)')">저장</button>
      </div>

      <div class="card card-pad" style="max-width:560px;margin-top:20px;">
        <div class="card-title">HRD-Net 연동</div>
        <div class="field">
          <label>동기화 주기 (분)</label>
          <input type="number" value="10">
        </div>
        <button class="btn btn-outline" onclick="alert('지금 즉시 동기화를 실행했습니다. (프로토타입 데모)')">지금 동기화</button>
      </div>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
